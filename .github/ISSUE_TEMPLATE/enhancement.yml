name: Enhancement
description: A change to how the library works, a message or feature to add, or a cleanup of the code
labels: ["enhancement", "needs-triage"]
body:
  - type: textarea
    id: why
    attributes:
      label: Why
      description: What you cannot do today.
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What will exist when this is done. One deliverable per issue. For a message, give the identifier (for example camt.057.001.08) and your use case.
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: Checkable conditions, including how it is tested.
    validations:
      required: true
  - type: textarea
    id: related
    attributes:
      label: Related
      description: Issues and pull requests, as #number.
