name: Bug
description: A package throws, accepts or rejects the wrong value, or does not match the ISO 20022 specification
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        The fastest way to get a bug fixed is a **test that fails today**. The test becomes the proof, and the pull request that makes it pass closes the issue.
  - type: dropdown
    id: package
    attributes:
      label: Package
      options:
        - "@beneficial-strategies/iso20022-validate"
        - "@beneficial-strategies/iso20022-types"
        - "@beneficial-strategies/iso20022-serialize"
        - "@beneficial-strategies/iso20022-react"
        - "@beneficial-strategies/iso20022-react-ui"
        - Message Explorer (the web app)
        - Not sure
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Package version
      description: Run `npm ls @beneficial-strategies/iso20022-validate` (or the package above).
      placeholder: 0.1.0-alpha.1
    validations:
      required: true
  - type: input
    id: message
    attributes:
      label: ISO 20022 message or type involved
      description: The message identifier (for example pain.001.001.13) or the type name, if the bug is about one.
  - type: textarea
    id: problem
    attributes:
      label: What happens, and what should happen
      description: Include the exact error text or the wrong value. If you are reporting a business rule, say which rule.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Input that shows it
      description: The smallest XML, JSON or code that reproduces it. Remove anything confidential.
      render: text
  - type: dropdown
    id: has-test
    attributes:
      label: Is there a test that reproduces it?
      options:
        - "Yes, linked below (it fails today)"
        - "No, but I can add one"
        - "No, I cannot add one"
    validations:
      required: true
  - type: input
    id: test-link
    attributes:
      label: Link to the failing test
      description: A link to the test in a pull request, branch or fork, and its name. A bug without a test gets the `needs-test` label.
  - type: textarea
    id: related
    attributes:
      label: Related
      description: Issues and pull requests, as #number.
