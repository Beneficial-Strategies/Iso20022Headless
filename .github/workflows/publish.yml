# Publishes the five packages to npm when a version tag is pushed (v0.1.0, v0.1.0-alpha.1, ...).
#
# No npm token is stored anywhere: each package trusts this repository and this workflow file (npm "Trusted Publisher"), and GitHub gives the job a
# short-lived credential. The job runs in the `npm` environment, which should require a reviewer, so a tag alone cannot publish.
# One-time setup, and how to release: docs/publishing.md.
name: Publish to npm

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']

permissions:
  contents: read
  id-token: write   # the short-lived credential for npm (trusted publishing and provenance)

jobs:
  publish:
    name: Test, build, publish
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      # trusted publishing needs npm 11.5.1 or later
      - run: npm install -g npm@latest
      - run: pnpm install --frozen-lockfile

      - name: The tag is the version of every package
        id: version
        run: echo "tag=$(node tools/publish/check-version.mjs "${GITHUB_REF_NAME#v}")" >> "$GITHUB_OUTPUT"

      - run: node tools/publish/sync-manifests.mjs --check
      - run: pnpm -r run typecheck
      - run: pnpm --filter "./packages/*" run test
      - run: pnpm --filter "./packages/*" run build

      # topological order; a version that is already on npm is skipped
      - name: Publish
        env:
          NPM_CONFIG_PROVENANCE: 'true'
        run: pnpm --filter "./packages/*" publish --access public --tag "${{ steps.version.outputs.tag }}" --no-git-checks
