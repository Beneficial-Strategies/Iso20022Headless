name: Pack the packages

# The tarballs `npm publish` would upload, as an artifact, so another project can try this branch before it is released
# (tools/publish/pack-all.mjs; docs/publishing.md).
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check the licenses of the packages we depend on
        run: node tools/licenses/check.mjs
      - run: node tools/publish/pack-all.mjs --out "$RUNNER_TEMP/packs"
      - uses: actions/upload-artifact@v4
        with:
          name: headless-packs
          path: ${{ runner.temp }}/packs
          retention-days: 14
